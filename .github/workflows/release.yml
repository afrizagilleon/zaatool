# Publishes the two images to GHCR and attaches the files an installer needs to a GitHub
# Release. Runs on a version tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# or by hand (workflow_dispatch) with a version name, to publish a test image without a tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (for example v1.0.0-rc1). No GitHub Release is made."
        required: true

env:
  REGISTRY: ghcr.io
  OWNER: afrizagilleon

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Least privilege: this job writes packages and reads the code, nothing else.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [engine, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Work out the version
        id: v
        env:
          # Through env, never pasted into the script: a dispatch input is text someone typed.
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # Checked here, once: everything after this step trusts the value, including the
          # shell lines that build tags from it. A semver-ish tag only; nothing a shell reads.
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Version '$VERSION' is not like v1.2.3 or v1.2.3-rc1" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          IMAGE_NAME: ${{ matrix.image }}
          VERSION: ${{ steps.v.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          IMAGE="ghcr.io/${OWNER}/zaatool-${IMAGE_NAME}"
          TAGS="${IMAGE}:${VERSION}"
          # `latest` follows tagged releases only; a manual run never moves it.
          if [ "$EVENT" = "push" ]; then TAGS="${TAGS},${IMAGE}:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ steps.v.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

  release:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Assemble the release files
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # The same check as the images job: the tag name reaches sed and gh below.
          printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          mkdir dist
          cp docker-compose.yml .env.example dist/
          # The installer attached to a release knows its own version: the one-liner from
          # the release page installs exactly this release, files and images alike.
          sed "s|^EMBEDDED_VERSION=.*|EMBEDDED_VERSION=\"${VERSION}\"|" scripts/install.sh > dist/install.sh
          grep -q "^EMBEDDED_VERSION=\"${VERSION}\"" dist/install.sh
          cd dist && sha256sum docker-compose.yml .env.example install.sh > SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$VERSION" dist/* \
            --repo "$REPO" \
            --title "$VERSION" \
            --generate-notes
