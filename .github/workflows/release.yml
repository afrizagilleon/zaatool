# Publishes the two images to GHCR and attaches the files an installer needs to a GitHub
# Release. Runs on a version tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# or by hand (workflow_dispatch) with a version name, to publish a test image without a tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (for example v1.0.0-rc1). No GitHub Release is made."
        required: true

env:
  REGISTRY: ghcr.io
  OWNER: afrizagilleon

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Least privilege: this job writes packages and reads the code, nothing else.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [engine, web]
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: v
        env:
          # Through env, never pasted into the script: a dispatch input is text someone typed.
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          IMAGE="ghcr.io/${OWNER}/zaatool-${{ matrix.image }}"
          TAGS="${IMAGE}:${{ steps.v.outputs.version }}"
          # `latest` follows tagged releases only; a manual run never moves it.
          if [ "${{ github.event_name }}" = "push" ]; then TAGS="${TAGS},${IMAGE}:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ steps.v.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

  release:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the release files
        run: |
          mkdir dist
          cp docker-compose.yml .env.example dist/
          # The installer attached to a release knows its own version: the one-liner from
          # the release page installs exactly this release, files and images alike.
          sed 's|^EMBEDDED_VERSION=.*|EMBEDDED_VERSION="${{ github.ref_name }}"|' scripts/install.sh > dist/install.sh
          grep -q "^EMBEDDED_VERSION=\"${{ github.ref_name }}\"" dist/install.sh
          cd dist && sha256sum docker-compose.yml .env.example install.sh > SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
