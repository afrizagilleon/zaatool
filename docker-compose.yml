# zaatool, on a machine that is not your laptop.
#
# Three services. There used to be four: MinIO was here from the beginning and nothing ever
# used it — `storage.service.ts` writes to a folder on disk. It is gone rather than kept
# "for later", because a running service nobody uses is a password to rotate, a port to
# firewall, and a thing to explain to whoever reads this next.
#
# Redis is absent for a different reason, and it is a decision rather than an omission:
# nothing here is shared between processes. The scheduler is one process and the run gate
# is one process, so a second engine would break on cron long before it needed a cache.
#
# The engine and web images are pulled from GHCR, not built here: a server that only runs
# zaatool has no business compiling it. The version is ZAATOOL_VERSION in .env (default
# `latest`; pin a release such as v1.2.0 so an update is a decision, not an accident).
#
#   scripts/install.sh --start                      # writes .env, pulls, starts
#   docker compose pull && docker compose up -d     # by hand, once .env exists
#
# To build from source instead, add docker-compose.build.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# See DEPLOY.md.

# Every service rotates its own log, so a chatty container cannot fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-50m}
    max-file: "${LOG_MAX_FILE:-10}"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zaa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-zaa_tool}
    # No `ports:` on purpose. Only the engine talks to this database, over the compose
    # network, and a database port on the host is a port to firewall and a password to guard
    # on a machine that runs other things. For `pnpm dev` against this Postgres, add
    # docker-compose.dev.yml (it publishes 127.0.0.1:5432 and nothing else).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zaa_user} -d ${POSTGRES_DB:-zaa_tool}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  engine:
    image: ghcr.io/afrizagilleon/zaatool-engine:${ZAATOOL_VERSION:-latest}
    environment:
      NODE_ENV: production
      # No default, on purpose. The engine refuses to start in production without it —
      # see packages/engine/src/config.ts.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Encrypts the secrets table. No default either: see DEPLOY.md before changing it.
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-zaa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zaa_tool}
      # The operational log: debug|info|warn|error, and json (one object per line, what a log
      # shipper wants) or pretty (for reading by eye). See "Logs" in DEPLOY.md.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Off unless you are letting the first person in. Turn it on, register, turn it off.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      # Whether the session cookie is `Secure`. Unset means yes, because NODE_ENV is
      # production. Set `false` only to try the stack over plain HTTP; a browser will not
      # send a Secure cookie back over HTTP, so sign-in appears to work and nothing sticks.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # The one time zone cron triggers are read in. See DEPLOY.md.
      CRON_TZ: ${CRON_TZ:-UTC}
      UV_LOCK_TIMEOUT_SECONDS: ${UV_LOCK_TIMEOUT_SECONDS:-120}
      # Per-cell hard limits (memory, processes per cell, largest file), and the looser ones
      # for the `uv` that installs a notebook's packages. Empty means the engine's own
      # default; see .env.example.
      MAX_CELL_MEMORY_MB: ${MAX_CELL_MEMORY_MB:-}
      MAX_PYTHON_CELL_MEMORY_MB: ${MAX_PYTHON_CELL_MEMORY_MB:-}
      MAX_CELL_PROCESSES: ${MAX_CELL_PROCESSES:-}
      MAX_CELL_FILE_MB: ${MAX_CELL_FILE_MB:-}
      # What cells may reach on the private networks, which the image's firewall otherwise
      # refuses them (the engine's own port, the database, other containers, the cloud
      # metadata address). Comma-separated CIDRs or host:port; empty means nothing. See
      # DEPLOY.md.
      CELL_EGRESS_ALLOW: ${CELL_EGRESS_ALLOW:-}
      # `off` starts the engine without that firewall, loudly. Leave it on.
      CELL_EGRESS_FIREWALL: ${CELL_EGRESS_FIREWALL:-on}
      MAX_OWNER_DISK_MB: ${MAX_OWNER_DISK_MB:-}
      MAX_INSTALL_MEMORY_MB: ${MAX_INSTALL_MEMORY_MB:-}
      MAX_INSTALL_PROCESSES: ${MAX_INSTALL_PROCESSES:-}
      MAX_INSTALL_FILE_MB: ${MAX_INSTALL_FILE_MB:-}
      # Read by the login and webhook limiters to tell clients apart behind nginx. One hop:
      # nginx, and nobody behind it. Not the engine's own default (private networks), because
      # nginx can see a client on a private address too (Docker Desktop, rootless Docker, a
      # proxy on the host) and that client would then be trusted to name its own address.
      # The engine publishes no port, so nothing reaches it except through nginx. If another
      # proxy sits in front of nginx, count it: 2.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Replaces the random setup code printed to the log while no account exists. Leave it
      # unset unless a script has to create the first account without reading the log.
      SETUP_CODE: ${SETUP_CODE:-}
    # The two capabilities the engine's sandbox needs on top of Docker's defaults:
    #   NET_ADMIN    the entrypoint installs the iptables rules that keep cells off the engine's
    #                own port, the database and the rest of the network (S-06), then drops
    #                this capability from the engine, so nothing it runs can remove them. The
    #                engine refuses to start if the rules are not there.
    #   SYS_RESOURCE the engine pins each cell's oom_score_adj at 1000, so a container that
    #                runs out of memory kills a cell rather than the engine (S-17). Writing it
    #                needs this capability, and without it a cell could lower its own value
    #                again. The engine keeps it.
    # Neither lets a cell do anything: cells run as unprivileged uids with no capabilities.
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    # A runaway cell or a pile of nested runs should slow zaatool down, not the other
    # services on this machine. Change them in .env.
    mem_limit: ${ENGINE_MEMORY_LIMIT:-2g}
    cpus: ${ENGINE_CPU_LIMIT:-2}
    # Processes and threads in the whole container, the engine's and every cell's. Without a
    # bound, one fork bomb in a cell exhausts the host's pids rather than this container's.
    # Each cell process is bounded separately by MAX_CELL_PROCESSES (128).
    pids_limit: ${ENGINE_PIDS_LIMIT:-4096}
    volumes:
      # Everything notebooks write, and everything sent to them. Without this, every file
      # produced since the last deploy disappears on the next one.
      - storage_data:/app/packages/storage
    # Healthy means the HTTP server answers, which is after the migrations have run. Node is
    # already in the image; nothing is installed for this.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/afrizagilleon/zaatool-web:${ZAATOOL_VERSION:-latest}
    # The only published port. It serves the app and proxies everything the engine owns,
    # so there is one origin, one certificate to buy, and a share link that is a URL on
    # your own domain. Bound to this machine only: a reverse proxy on the same host (Caddy)
    # reaches it, nothing else does. WEB_BIND=0.0.0.0 is for trying the stack directly,
    # without a proxy, and goes with COOKIE_SECURE=false over plain HTTP.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    # nginx runs as uid 101 (no root) and still listens on 80 inside the container. Docker
    # already allows that by default; stated here so a runtime with another default does too.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

  # Optional, off unless the "caddy" profile is on (install.sh --with-caddy sets
  # COMPOSE_PROFILES=caddy in .env). For a server that has no reverse proxy of its own: it
  # asks for the certificate and terminates HTTPS. A server that already runs Caddy or nginx
  # should not enable it; ports 80 and 443 would collide. install.sh writes the Caddyfile and
  # a docker-compose.override.yml that stops publishing the web port on the host.
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
  caddy_data:
  caddy_config:
