# SonarCloud automatic analysis. Docs (checked 2026-11-20, again 2026-11-23):
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/
# Production code and its infrastructure files are analysed; tests are declared as tests.
#
# packages/engine/Dockerfile is deliberately NOT in sonar.sources. Its one finding is that the
# engine runs as root inside its container, and that is the design: the engine starts every
# cell as the notebook owner's own Linux uid (K-02, FX-20), which needs root. The trade-off is
# written in the Dockerfile itself and in ARCHITECTURE.md "Sandboxing, honestly". The finding
# is raised on the FROM line, where a Dockerfile allows no trailing NOSONAR comment, and
# automatic analysis does not accept per-rule ignores (sonar.issue.ignore.*) in this file. The
# right tool is "Accept" in the SonarCloud UI: whoever has access should put the Dockerfile
# back in the list below and accept that one finding, so the rest of the file is checked again.
# Until then, changes to that Dockerfile are reviewed by hand (its install runs with
# --ignore-scripts; see FX-23).
sonar.sources=packages/engine/src,packages/engine/scripts,packages/web/src,packages/web/Dockerfile,packages/web/index.html,packages/shared/src,scripts,.github,docker-compose.yml,docker-compose.build.yml,docker-compose.dev.yml
sonar.tests=packages/engine/tests,packages/web/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,packages/storage/**
# Tests repeat set-up on purpose; they do not count towards duplication.
sonar.cpd.exclusions=**/tests/**
