# SonarCloud automatic analysis. Docs (checked 2026-11-20):
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/
# Production code and its infrastructure files are analysed; tests are declared as tests.
sonar.sources=packages/engine/src,packages/engine/scripts,packages/engine/Dockerfile,packages/web/src,packages/web/Dockerfile,packages/web/index.html,packages/shared/src,scripts,.github,docker-compose.yml,docker-compose.build.yml,docker-compose.dev.yml
sonar.tests=packages/engine/tests,packages/web/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,packages/storage/**
# Tests repeat set-up on purpose; they do not count towards duplication.
sonar.cpd.exclusions=**/tests/**
