# `Connection: upgrade` only when the request is asking for it.
#
# Sent unconditionally, it breaks ordinary keep-alive requests; left out entirely, the run
# event stream never opens and every page sits on "Waiting" forever. This map is the
# standard answer to both, and it has to live at `http` level rather than inside a server
# block, which is why it is a second file.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The access log, with the credentials taken out.
#
# A webhook's slug is the whole of its authentication and a share link's token is the whole
# of its, and both travel in the path (`/hooks/<slug>`, `/api/shared/<token>`, `/a/<token>`).
# nginx's stock `main` format writes `$request` as received, so a log shipped anywhere would
# be a list of working keys. The path is masked here, and the query string is not logged at
# all: `sig` (signed storage links) and `token` are the credentials that ride in it, and the
# rest of it has never been needed to answer "what happened".
#
# The chain is two maps because the first isolates the path from `$request_uri` (which is
# the original request, unlike `$uri`, which `try_files` rewrites to /index.html) and the
# second masks it while keeping what follows the credential (`/api/shared/[token]/run`).
map $request_uri $zaa_req_path {
    default          $request_uri;
    ~^(?<zaa_p>[^?]*) $zaa_p;
}

map $zaa_req_path $zaa_log_path {
    default                                 $zaa_req_path;
    ~^/hooks/[^/]+(?<zaa_r1>.*)$            "/hooks/[slug]$zaa_r1";
    ~^/api/shared/[^/]+(?<zaa_r2>.*)$       "/api/shared/[token]$zaa_r2";
    ~^/a/[^/]+(?<zaa_r3>.*)$                "/a/[token]$zaa_r3";
}

# JSON, one object per line, like the engine's own log, so one shipper reads both.
# `request_id` is also sent to the engine (X-Request-Id), which is what joins the two lines
# of one request. `escape=json` is what keeps a hostile path or user agent from forging a
# second line or breaking out of its field.
log_format zaa_json escape=json
    '{"ts":"$time_iso8601","service":"zaatool-web","event":"http.access",'
    '"request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method",'
    '"path":"$zaa_log_path","status":$status,"bytes":$body_bytes_sent,'
    '"duration_ms":$request_time,"upstream_ms":"$upstream_response_time",'
    '"host":"$http_host","user_agent":"$http_user_agent"}';
