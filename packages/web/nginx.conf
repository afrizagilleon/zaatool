# One origin for the app and the engine.
#
# Everything the engine owns is proxied through; everything else is the single-page app.
# That is what lets `API_BASE_URL` be empty in a deployed build, and it is what makes
# `https://your-domain/a/<token>` work — a share link has to be a real URL on a real
# domain, not a path the browser is asked to guess about.

upstream engine {
    server engine:4000;
}

server {
    listen 80;
    server_name _;

    # Notebooks can be sent files, and a webhook is how a phone sends a photo. The default
    # of 1 MB would reject most of them; this is the engine's own MAX_UPLOAD_MB with room.
    client_max_body_size 32m;

    # A run can take minutes, and the WebSocket carrying its events stays open the whole
    # time. nginx's 60-second default would cut both off and report it to the caller as a
    # failure that never happened.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The engine's surface, listed rather than pattern-matched so nothing is proxied by
    # accident. A path that is not here is the app's.
    location /api/     { proxy_pass http://engine; }
    location /hooks/   { proxy_pass http://engine; }
    location /mcp      { proxy_pass http://engine; }
    location /storage/ { proxy_pass http://engine; }

    # The run-event stream. It used to connect to `/`, which matched the block below and
    # was answered with `index.html` — an upgrade request served a web page, so live run
    # events never worked in a deployed build and nothing said why.
    location /ws       { proxy_pass http://engine; }

    # The app, including `/a/<token>` — a shared page is rendered in the browser, so the
    # server's answer for any unknown path is the app itself.
    #
    # Headers are repeated here on purpose: nginx drops every inherited `add_header` as
    # soon as a location declares one of its own, so they cannot live at server level.
    # `/storage/` is not touched — its headers (nosniff, CSP sandbox, Content-Disposition,
    # Referrer-Policy) come from the engine and proxy_pass forwards them unchanged.
    location / {
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
