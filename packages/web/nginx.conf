# One origin for the app and the engine.
#
# Everything the engine owns is proxied through; everything else is the single-page app.
# That is what lets `API_BASE_URL` be empty in a deployed build, and it is what makes
# `https://your-domain/a/<token>` work — a share link has to be a real URL on a real
# domain, not a path the browser is asked to guess about.

upstream engine {
    server engine:4000;
}

server {
    listen 80;
    server_name _;

    # Notebooks can be sent files, and a webhook is how a phone sends a photo. The default
    # of 1 MB would reject most of them; this is the engine's own MAX_UPLOAD_MB with room.
    client_max_body_size 32m;

    # A run can take minutes, and the WebSocket carrying its events stays open the whole
    # time. nginx's 60-second default would cut both off and report it to the caller as a
    # failure that never happened.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # `$host` drops the port, so on anything but 80/443 the engine would see a host that
    # differs from the browser's `Origin` and refuse the WebSocket (it compares them to keep
    # other sites from opening one with the visitor's cookie). This is set here, never passed
    # through: a client's own X-Forwarded-Host is replaced, not forwarded.
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The engine's surface, listed rather than pattern-matched so nothing is proxied by
    # accident. A path that is not here is the app's.
    location /api/     { proxy_pass http://engine; }
    location /hooks/   { proxy_pass http://engine; }
    location /mcp      { proxy_pass http://engine; }
    location /storage/ { proxy_pass http://engine; }

    # The run-event stream. It used to connect to `/`, which matched the block below and
    # was answered with `index.html` — an upgrade request served a web page, so live run
    # events never worked in a deployed build and nothing said why.
    location /ws       { proxy_pass http://engine; }

    # The app, including `/a/<token>` — a shared page is rendered in the browser, so the
    # server's answer for any unknown path is the app itself.
    #
    # Headers are repeated here on purpose: nginx drops every inherited `add_header` as
    # soon as a location declares one of its own, so they cannot live at server level.
    # `/storage/` is not touched — its headers (nosniff, CSP sandbox, Content-Disposition,
    # Referrer-Policy) come from the engine and proxy_pass forwards them unchanged. `/api`
    # answers JSON and needs no policy of its own.
    #
    # The policy for the app itself. Scripts only from this origin and none inline: a page
    # that renders output from a notebook is one injection away from running someone else's
    # code, and this is what stops that code from being the page's. `style-src` allows inline
    # styles because the UI sets them (React `style=`, Tailwind's runtime values) and a style
    # cannot run anything. `connect-src` names `ws:` and `wss:` for the run-event stream, which
    # `'self'` does not cover for sockets in every browser. `frame-src 'self'` is for the
    # storage preview and `frame-ancestors 'none'` is the CSP twin of `X-Frame-Options`.
    # `media-src` also allows `data:`: a notebook may return audio or video as a data URI
    # (`media-source.ts` uses a string as written) and the browser blocked those until this
    # was added. Media cannot run script, so this widens nothing that matters.
    location / {
        root /usr/share/nginx/html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
